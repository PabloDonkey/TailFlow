<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Triage</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: sans-serif;
    color: #eee; background: #181818; overscroll-behavior: none; }
  #tint { position: fixed; inset: 0; pointer-events: none; }
  #info { position: fixed; top: 0; left: 0; right: 0; padding: 8px 12px; text-align: center;
    z-index: 2; pointer-events: none; text-shadow: 0 0 4px #000; }
  #artist { font-size: 1.3em; font-weight: bold; }
  #file, #counter { font-size: 0.85em; opacity: 0.8; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; padding: 70px 10px 10px; box-sizing: border-box; }
  #card { max-width: 100%; max-height: 100%; touch-action: none; user-select: none;
    -webkit-user-drag: none; cursor: grab; border-radius: 8px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6); }
  #message { position: fixed; bottom: 12px; left: 12px; right: 12px; text-align: center;
    color: #fff; background: #a22; border-radius: 6px; padding: 8px; display: none; z-index: 3; }
  #done { font-size: 1.6em; text-align: center; }
</style>
</head>
<body>
<div id="tint"></div>
<div id="info">
  <div id="artist"></div>
  <div id="file"></div>
  <div id="counter"></div>
</div>
<div id="stage"><img id="card" alt="" draggable="false"></div>
<div id="message"></div>
<script>
"use strict";

// Fraction of the screen that a drag must pass to make a choice.
const THRESHOLD = 1 / 3;
const MAX_TILT_DEGREES = 25;
const FLY_MS = 250;
// Background colors: [red, green, blue].
const COLORS = { reject: [220, 50, 50], keep: [50, 190, 80], fave: [235, 200, 40] };

const card = document.getElementById("card");
const tint = document.getElementById("tint");
const message = document.getElementById("message");

let images = [];      // images still to sort, in order
let decided = 0;      // images already in keep/, reject/ or fave/
let total = 0;        // decided + still to sort, counted when the page loads
let busy = false;     // true while a choice is being sent
let drag = null;      // { id, x, y } while the pointer is down

function showMessage(text) {
  message.textContent = text;
  message.style.display = "block";
  setTimeout(() => { message.style.display = "none"; }, 4000);
}

async function loadState() {
  const response = await fetch("/api/state");
  const state = await response.json();
  images = state.images;
  const counts = state.counts;
  decided = counts.fave + counts.keep + counts.reject;
  total = decided + images.length;
  render(counts);
}

// The text before "__", or the full name if there is no "__".
function artistName(name) {
  const index = name.indexOf("__");
  return index > 0 ? name.slice(0, index) : name;
}

function render(counts) {
  resetCard(false);
  if (images.length === 0) {
    const c = counts || { fave: 0, keep: 0, reject: 0 };
    document.getElementById("stage").innerHTML =
      `<div id="done">Done. Fave: ${c.fave}, Keep: ${c.keep}, Reject: ${c.reject}</div>`;
    document.getElementById("artist").textContent = "";
    document.getElementById("file").textContent = "";
    document.getElementById("counter").textContent = "";
    return;
  }
  const current = images[0];
  card.src = "/image/" + encodeURIComponent(current);
  document.getElementById("artist").textContent = artistName(current);
  document.getElementById("file").textContent = current;
  document.getElementById("counter").textContent = `${decided} / ${total}`;
  if (images[1]) { new Image().src = "/image/" + encodeURIComponent(images[1]); }
}

// Which choice does this drag point to, and how far along is it (0 to 1+)?
function direction(dx, dy) {
  if (dy < 0 && Math.abs(dy) > Math.abs(dx)) {
    return { choice: "fave", progress: -dy / (window.innerHeight * THRESHOLD) };
  }
  if (dx > 0) { return { choice: "keep", progress: dx / (window.innerWidth * THRESHOLD) }; }
  if (dx < 0) { return { choice: "reject", progress: -dx / (window.innerWidth * THRESHOLD) }; }
  return { choice: null, progress: 0 };
}

function setTint(choice, progress) {
  if (!choice) { tint.style.background = "transparent"; return; }
  const [r, g, b] = COLORS[choice];
  const alpha = Math.min(1, progress) * 0.7;
  tint.style.background = `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function moveCard(dx, dy) {
  const tilt = Math.max(-1, Math.min(1, dx / window.innerWidth)) * MAX_TILT_DEGREES;
  card.style.transform = `translate(${dx}px, ${dy}px) rotate(${tilt}deg)`;
}

function resetCard(animate) {
  card.style.transition = animate ? "transform 0.25s ease-out" : "none";
  card.style.transform = "";
  tint.style.transition = animate ? "background 0.25s" : "none";
  setTint(null, 0);
}

card.addEventListener("pointerdown", (event) => {
  if (busy || drag) { return; }
  drag = { id: event.pointerId, x: event.clientX, y: event.clientY };
  card.setPointerCapture(event.pointerId);
  card.style.transition = "none";
  tint.style.transition = "none";
});

card.addEventListener("pointermove", (event) => {
  if (!drag || event.pointerId !== drag.id) { return; }
  const dx = event.clientX - drag.x;
  const dy = event.clientY - drag.y;
  moveCard(dx, dy);
  const { choice, progress } = direction(dx, dy);
  setTint(choice, progress);
});

function endDrag(event, cancelled) {
  if (!drag || event.pointerId !== drag.id) { return; }
  const dx = event.clientX - drag.x;
  const dy = event.clientY - drag.y;
  drag = null;
  const { choice, progress } = direction(dx, dy);
  if (!cancelled && choice && progress >= 1) {
    choose(choice, dx, dy);
  } else {
    resetCard(true);
  }
}
card.addEventListener("pointerup", (event) => endDrag(event, false));
card.addEventListener("pointercancel", (event) => endDrag(event, true));

// Fly the card off the screen, send the choice, then show the next image.
async function choose(choice, fromX, fromY) {
  if (busy || images.length === 0) { return; }
  busy = true;
  const current = images[0];
  const flyTo = {
    keep: [window.innerWidth * 1.5, fromY || 0],
    reject: [-window.innerWidth * 1.5, fromY || 0],
    fave: [fromX || 0, -window.innerHeight * 1.5],
  }[choice];
  card.style.transition = `transform ${FLY_MS}ms ease-in`;
  moveCard(flyTo[0], flyTo[1]);
  setTint(choice, 1);
  try {
    const [response] = await Promise.all([
      fetch("/api/move", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: current, choice }),
      }),
      new Promise((resolve) => setTimeout(resolve, FLY_MS)),
    ]);
    if (response.ok) {
      images.shift();
      decided += 1;
      render(await freshCounts());
    } else {
      const body = await response.json();
      if (body.error === "already_moved") {
        // Another device sorted this image. Load the list again.
        await loadState();
      } else {
        showMessage(body.message || body.error || "The move failed.");
        resetCard(true);
      }
    }
  } catch (error) {
    showMessage("Cannot reach the server.");
    resetCard(true);
  }
  busy = false;
}

async function freshCounts() {
  if (images.length > 0) { return null; }
  const response = await fetch("/api/state");
  return (await response.json()).counts;
}

document.addEventListener("keydown", (event) => {
  if (drag) { return; }
  const choice = { ArrowRight: "keep", ArrowLeft: "reject", ArrowUp: "fave" }[event.key];
  if (!choice) { return; }
  event.preventDefault();
  choose(choice, 0, 0);
});

loadState().catch(() => showMessage("Cannot reach the server."));
</script>
</body>
</html>
