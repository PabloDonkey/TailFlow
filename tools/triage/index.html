<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Triage</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: sans-serif;
    color: #eee; background: #181818; overscroll-behavior: none; }
  #tint { position: fixed; inset: 0; pointer-events: none; }
  #info { position: fixed; top: 0; left: 0; right: 0; padding: 8px 12px; text-align: center;
    z-index: 2; pointer-events: none; text-shadow: 0 0 4px #000; }
  #artist { font-size: 1.3em; font-weight: bold; }
  #file, #counter { font-size: 0.85em; opacity: 0.8; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center;
    justify-content: center; padding: 70px 10px 10px; box-sizing: border-box; }
  #card { max-width: 100%; max-height: 100%; touch-action: none; user-select: none;
    -webkit-user-drag: none; cursor: grab; border-radius: 8px;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.6); }
  #message { position: fixed; bottom: 12px; left: 12px; right: 12px; text-align: center;
    color: #fff; background: #a22; border-radius: 6px; padding: 8px; display: none; z-index: 3; }
  #done { font-size: 1.6em; text-align: center; }
</style>
</head>
<body>
<div id="tint"></div>
<div id="info">
  <div id="artist"></div>
  <div id="file"></div>
  <div id="counter"></div>
</div>
<div id="stage"><img id="card" alt="" draggable="false"></div>
<div id="message"></div>
<script>
"use strict";

// Fraction of the screen that a drag must pass to make a choice.
const THRESHOLD = 1 / 3;
const MAX_TILT_DEGREES = 25;
const MOVE_OUT_MS = 250;
// One rule for each choice: the key, the drag axis, the sign on that axis, and the color.
// Down has no choice, so a drag down does nothing.
const CHOICES = {
  reject: { key: "ArrowLeft", axis: "x", sign: -1, color: [220, 50, 50] },
  keep: { key: "ArrowRight", axis: "x", sign: 1, color: [50, 190, 80] },
  fave: { key: "ArrowUp", axis: "y", sign: -1, color: [235, 200, 40] },
};

const card = document.getElementById("card");
const tint = document.getElementById("tint");
const message = document.getElementById("message");

let images = [];      // file names still to sort, in order
let artists = [];     // the artist of each file name, from the server
let decided = 0;      // images already in keep/, reject/ or fave/
let total = 0;        // decided + still to sort, counted when the page loads
let busy = false;     // true while a choice is sent or an image loads
let drag = null;      // { id, x, y } while the pointer is down

function showError(error) {
  showMessage(error.message || "Cannot reach the server.");
}

function showMessage(text) {
  message.textContent = text;
  message.style.display = "block";
  setTimeout(() => { message.style.display = "none"; }, 4000);
}

// Read the state from the server. Throws an Error if the request fails.
async function fetchState() {
  const response = await fetch("/api/state");
  if (!response.ok) { throw new Error(`The server answered ${response.status}.`); }
  return response.json();
}

// Replace the list with the state of the server and show the first image.
// The caller must hold `busy`, so no choice runs at the same time.
async function applyState() {
  const state = await fetchState();
  images = state.images;
  artists = state.artists;
  const counts = state.counts;
  decided = counts.fave + counts.keep + counts.reject;
  total = decided + images.length;
  await render(counts);
}

async function loadState() {
  busy = true;
  try {
    await applyState();
  } catch (error) {
    showError(error);
    resetCard(true);
  }
  busy = false;
}

// Show the first image. The promise ends when the image has loaded or failed to load.
// The card stays hidden until then, so the old image cannot be sorted twice.
function render(counts) {
  resetCard(false);
  if (images.length === 0) {
    // Without counts (the server could not be read), show "Done." only.
    const text = counts
      ? `Done. Fave: ${counts.fave}, Keep: ${counts.keep}, Reject: ${counts.reject}`
      : "Done.";
    document.getElementById("stage").innerHTML = `<div id="done">${text}</div>`;
    document.getElementById("artist").textContent = "";
    document.getElementById("file").textContent = "";
    document.getElementById("counter").textContent = "";
    return Promise.resolve();
  }
  document.getElementById("artist").textContent = artists[0];
  document.getElementById("file").textContent = images[0];
  document.getElementById("counter").textContent = `${decided} / ${total}`;
  if (images[1]) { new Image().src = "/image/" + encodeURIComponent(images[1]); }
  card.style.visibility = "hidden";
  const name = images[0];
  return new Promise((resolve) => {
    const done = async (event) => {
      card.removeEventListener("load", done);
      card.removeEventListener("error", done);
      // The caller waits for this promise and holds `busy`, so the recovery
      // finishes before any other action can start.
      if (event.type === "error") { await recoverFromImageError(name); }
      card.style.visibility = "visible";
      resolve();
    };
    card.addEventListener("load", done);
    card.addEventListener("error", done);
    card.src = "/image/" + encodeURIComponent(images[0]);
  });
}

// The image did not load. Another device may have moved it, so read the list
// again. If the image is still in the list, only show the message. This stops
// an endless loop for a file that the server cannot read.
async function recoverFromImageError(name) {
  showMessage(`Cannot load ${name}.`);
  try {
    const state = await fetchState();
    if (!state.images.includes(name)) { await applyState(); }
  } catch (error) {
    showError(error);
  }
}

// Which choice does this drag point to, and how far along is it (0 to 1 or more)?
function direction(dx, dy) {
  const axis = Math.abs(dy) > Math.abs(dx) ? "y" : "x";
  const delta = axis === "x" ? dx : dy;
  const size = axis === "x" ? window.innerWidth : window.innerHeight;
  for (const [choice, rule] of Object.entries(CHOICES)) {
    if (rule.axis === axis && Math.sign(delta) === rule.sign) {
      return { choice, progress: Math.abs(delta) / (size * THRESHOLD) };
    }
  }
  return { choice: null, progress: 0 };
}

function setTint(choice, progress) {
  if (!choice) { tint.style.background = "transparent"; return; }
  const [r, g, b] = CHOICES[choice].color;
  const alpha = Math.min(1, progress) * 0.7;
  tint.style.background = `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function moveCard(dx, dy) {
  const tilt = Math.max(-1, Math.min(1, dx / window.innerWidth)) * MAX_TILT_DEGREES;
  card.style.transform = `translate(${dx}px, ${dy}px) rotate(${tilt}deg)`;
}

function resetCard(animate) {
  card.style.transition = animate ? "transform 0.25s ease-out" : "none";
  card.style.transform = "";
  tint.style.transition = animate ? "background 0.25s" : "none";
  setTint(null, 0);
}

card.addEventListener("pointerdown", (event) => {
  if (busy || drag) { return; }
  drag = { id: event.pointerId, x: event.clientX, y: event.clientY };
  card.setPointerCapture(event.pointerId);
  card.style.transition = "none";
  tint.style.transition = "none";
});

card.addEventListener("pointermove", (event) => {
  if (!drag || event.pointerId !== drag.id) { return; }
  const dx = event.clientX - drag.x;
  const dy = event.clientY - drag.y;
  moveCard(dx, dy);
  const { choice, progress } = direction(dx, dy);
  setTint(choice, progress);
});

function endDrag(event, cancelled) {
  if (!drag || event.pointerId !== drag.id) { return; }
  const dx = event.clientX - drag.x;
  const dy = event.clientY - drag.y;
  drag = null;
  const { choice, progress } = direction(dx, dy);
  if (!cancelled && choice && progress >= 1) {
    choose(choice, dx, dy);
  } else {
    resetCard(true);
  }
}
card.addEventListener("pointerup", (event) => endDrag(event, false));
card.addEventListener("pointercancel", (event) => endDrag(event, true));

// Move the card out of the screen, send the choice, then show the next image.
async function choose(choice, fromX, fromY) {
  if (busy || images.length === 0) { return; }
  busy = true;
  const rule = CHOICES[choice];
  const far = rule.sign * (rule.axis === "x" ? window.innerWidth : window.innerHeight) * 1.5;
  card.style.transition = `transform ${MOVE_OUT_MS}ms ease-in`;
  if (rule.axis === "x") { moveCard(far, fromY); } else { moveCard(fromX, far); }
  setTint(choice, 1);
  try {
    const [response] = await Promise.all([
      fetch("/api/move", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: images[0], choice }),
      }),
      new Promise((resolve) => setTimeout(resolve, MOVE_OUT_MS)),
    ]);
    if (response.ok) {
      images.shift();
      artists.shift();
      decided += 1;
      let counts = null;
      if (images.length === 0) {
        try {
          counts = (await fetchState()).counts;
        } catch (error) {
          showError(error);
        }
      }
      await render(counts);
    } else {
      const body = await response.json();
      if (body.error === "already_moved") {
        // Another device sorted this image. Load the list again.
        await applyState();
      } else {
        showMessage(body.message || body.error || "The move failed.");
        resetCard(true);
      }
    }
  } catch (error) {
    showError(error);
    resetCard(true);
  }
  busy = false;
}

document.addEventListener("keydown", (event) => {
  // Ignore a held key. One key press sorts one image.
  if (drag || event.repeat) { return; }
  const choice = Object.keys(CHOICES).find((name) => CHOICES[name].key === event.key);
  if (!choice) { return; }
  event.preventDefault();
  choose(choice, 0, 0);
});

loadState();
</script>
</body>
</html>
